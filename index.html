<!DOCTYPE html>
<html>
<head>
  <title>Digital Flip Clock by NotionElite</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background-color 0.3s ease;
      font-family: 'Roboto', sans-serif;
    }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .time {
      font-size: 6rem;
      font-weight: 300;
      display: flex;
      perspective: 1000px;
    }

    .hours-box,
    .minutes-box {
      padding: 30px 25px;
      width: 120px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 0.5s, background-color 0.3s ease;
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .hours-box::before,
    .minutes-box::before {
      content: "";
      position: absolute;
      top: 52%;
      left: 0;
      right: 0;
      height: 2px;
      background-color: rgba(0, 0, 0, 0.1);
      transform: translateY(-50%);
    }

    .flip {
      animation: fold 0.6s cubic-bezier(0.455, 0.03, 0.515, 0.955);
    }

    @keyframes fold {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    .time > div {
      margin: 0 10px;
    }

    #switch-btn,
    #format-switch {
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.2s ease;
      outline: none;
    }

    #switch-btn:hover,
    #format-switch:hover {
      transform: scale(1.1);
    }

    #switch-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
    }

    #format-switch {
      position: absolute;
      top: 5px;
      right: 5px;
    }

    .light-mode {
      background-color: #f0f0f0;
      color: #333;
    }

    .light-mode .hours-box,
    .light-mode .minutes-box {
      background-color: #fff;
      color: #333;
    }

    .light-mode #switch-btn,
    .light-mode #format-switch {
      color: #333;
    }

    .dark-mode {
      background-color: #1a1a1a;
      color: #fff;
    }

    .dark-mode .hours-box,
    .dark-mode .minutes-box {
      background-color: #2a2a2a;
      color: #fff;
    }

    .dark-mode #switch-btn,
    .dark-mode #format-switch {
      color: #fff;
    }

    .dark-mode .hours-box::before,
    .dark-mode .minutes-box::before {
      background-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="light-mode">
  <div class="clock">
    <div class="time">
      <div class="hours-box">
        <div id="hours"></div>
      </div>
      <div class="minutes-box">
        <div id="minutes"></div>
      </div>
    </div>
    <button id="format-switch"><i class="fas fa-clock"></i></button>
  </div>
  <button id="switch-btn"><i class="fas fa-adjust"></i></button>
  
  <script>
    let is24HourFormat = true;

    function updateTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      
      if (!is24HourFormat) {
        hours = hours % 12;
        hours = hours ? hours : 12; // the hour '0' should be '12'
      }
      
      const hoursElement = document.getElementById('hours');
      const minutesElement = document.getElementById('minutes');
      
      if (hoursElement.textContent !== hours.toString().padStart(2, '0')) {
        hoursElement.classList.add('flip');
        setTimeout(() => hoursElement.classList.remove('flip'), 500);
      }
      
      if (minutesElement.textContent !== minutes) {
        minutesElement.classList.add('flip');
        setTimeout(() => minutesElement.classList.remove('flip'), 500);
      }
      
      hoursElement.textContent = hours.toString().padStart(2, '0');
      minutesElement.textContent = minutes;
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      document.body.classList.toggle('dark-mode');
    }

    function toggleTimeFormat() {
      is24HourFormat = !is24HourFormat;
      updateTime();
    }

    document.getElementById('switch-btn').addEventListener('click', toggleTheme);
    document.getElementById('format-switch').addEventListener('click', toggleTimeFormat);

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
